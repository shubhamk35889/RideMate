<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RideMate</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Ride<span>Mate</span></a>
  <div class="nav-links">
    <a href="/register">New here? Register</a>
  </div>
</nav>

<div class="container" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
  <div class="form-card fade-in" style="width:100%">

    <div class="form-title">Welcome Back 🏍️</div>
    <div class="form-sub">Login to your RideMate account</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
        Login
      </button>

    </form>

    <div class="form-footer">
      Don't have an account? <a href="/register">Register here</a>
    </div>

  </div>
</div>

</body>
</html>
