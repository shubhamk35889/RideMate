<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — RideMate</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Ride<span>Mate</span></a>
  <div class="nav-links">
    <a href="/login">Already have an account? Login</a>
  </div>
</nav>

<div class="container" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
  <div class="form-card fade-in" style="width:100%">

    <div class="form-title">Create Account</div>
    <div class="form-sub">Join RideMate and start sharing rides</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Rahul Sharma" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="rahul@email.com" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="+91 98765 43210">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a strong password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
        Create Account
      </button>

    </form>

    <div class="form-footer">
      Already a member? <a href="/login">Login here</a>
    </div>

  </div>
</div>

</body>
</html>
